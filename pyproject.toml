[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalguard"
version = "1.2.0"
description = "SignalGuard: Stateful statistical guardrails and MCP server for autonomous LLM data agents, Text-to-SQL, and AutoML"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Peter Eldridge" }
]
keywords = [
    "signalguard",
    "feature-selection",
    "mcp",
    "mcp-server",
    "agentic-ai",
    "llm-guardrails",
    "automl",
    "information-gain",
    "multiple-testing",
    "winners-curse",
    "extreme-value-theory",
    "permutation-tests",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
signalguard-mcp = "signalguard.mcp_server:main"

[tool.setuptools.packages.find]
include = ["signalguard*"]
